services:
  postgres:
    image: postgres:16-alpine
    container_name: shopify-preorder-postgres
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT:-55432}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopify_preorder}
      POSTGRES_USER: ${POSTGRES_USER:-shopify_preorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      POSTGRES_PORT: ${POSTGRES_PORT:-55432}
    volumes:
      - shopify_preorder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${POSTGRES_PORT:-55432} -U ${POSTGRES_USER:-shopify_preorder} -d ${POSTGRES_DB:-shopify_preorder}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-preorder-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3187}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopify_preorder}:${POSTGRES_PASSWORD:-change_me_now}@postgres:${POSTGRES_PORT:-55432}/${POSTGRES_DB:-shopify_preorder}?schema=public
    ports:
      - "${APP_PORT:-3187}:${APP_PORT:-3187}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-3187}/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  shopify_preorder_pgdata:
